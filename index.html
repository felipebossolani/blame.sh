<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>blame.sh — Developer Excuse Generator</title>
  <!-- Favicon & Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#0D1117">
  <!-- Open Graph -->
  <meta property="og:title" content="blame.sh">
  <meta property="og:description" content="Pick who's asking. Pick what broke. Get your excuse.">
  <meta property="og:image" content="https://felipebossolani.github.io/blame.sh/logo.png">
  <meta property="og:url" content="https://felipebossolani.github.io/blame.sh/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="blame.sh">
  <meta name="twitter:description" content="Pick who's asking. Pick what broke. Get your excuse.">
  <meta name="twitter:image" content="https://felipebossolani.github.io/blame.sh/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0D1117;
      --card: #161B22;
      --border: #30363D;
      --text: #E6EDF3;
      --text-muted: #8B949E;
      --green: #3FB950;
      --blue: #58A6FF;
      --red: #F85149;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 960px;
      width: 100%;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--green);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-logo {
      height: 3rem;
      border-radius: 6px;
      image-rendering: pixelated;
    }

    header h1 span {
      color: var(--text-muted);
    }

    header p {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    /* Language toggle */
    .lang-toggle {
      display: flex;
      justify-content: center;
      gap: 0.25rem;
      margin-top: 1rem;
    }

    .lang-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.3rem 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn:first-child { border-radius: 4px 0 0 4px; }
    .lang-btn:last-child { border-radius: 0 4px 4px 0; }

    .lang-btn.active {
      background: var(--green);
      border-color: var(--green);
      color: var(--bg);
    }

    /* Terminal prompt */
    .terminal-prompt {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      max-width: 960px;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .prompt-line {
      flex: 1;
      min-width: 0;
      overflow-x: auto;
    }

    @media (max-width: 640px) {
      .terminal-prompt {
        flex-direction: column;
        align-items: stretch;
        gap: 0.5rem;
      }
    }

    .terminal-prompt .prompt-symbol {
      color: var(--green);
    }

    .terminal-prompt .cmd {
      color: var(--text);
    }

    .terminal-prompt .flag {
      color: var(--blue);
    }

    .terminal-prompt .value {
      color: var(--red);
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--green);
      vertical-align: text-bottom;
      animation: blink 1s step-end infinite;
      margin-left: 2px;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .terminal-prompt + .container {
      padding-top: 1.5rem;
    }

    /* Steps */
    .step {
      margin-bottom: 1.5rem;
    }

    .step-label {
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.75rem;
    }

    .step-label span {
      color: var(--green);
    }

    /* Chips */
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .chip {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip:hover {
      border-color: var(--green);
    }

    .chip.selected {
      border-color: var(--green);
      background: rgba(63, 185, 80, 0.1);
      color: var(--green);
    }

    /* Generate button */
    .generate-btn {
      background: var(--green);
      border: none;
      color: var(--bg);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 0.5rem 1.25rem;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .generate-btn.hidden {
      display: initial !important;
      visibility: hidden;
    }

    .generate-btn:hover {
      opacity: 0.85;
    }

    /* Results */
    .results {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 640px) {
      .results {
        grid-template-columns: 1fr;
      }
    }

    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
    }

    .result-card .tone-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.75rem;
      font-weight: 700;
    }

    .result-card.tecnica { border-top: 3px solid var(--green); }
    .result-card.tecnica .tone-label { color: var(--green); }

    .result-card.vaga { border-top: 3px solid var(--blue); }
    .result-card.vaga .tone-label { color: var(--blue); }

    .result-card.dramatica { border-top: 3px solid var(--red); }
    .result-card.dramatica .tone-label { color: var(--red); }

    .result-card .excuse-text {
      font-size: 0.82rem;
      line-height: 1.6;
      flex: 1;
      color: var(--text);
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
      align-self: flex-end;
      margin-top: 1rem;
    }

    .card-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.7rem;
      padding: 0.3rem 0.6rem;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .card-btn:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }

    .card-btn.copied {
      border-color: var(--green);
      color: var(--green);
    }

    /* Reset */
    .reset-wrap {
      text-align: center;
      margin-bottom: 2rem;
    }

    .reset-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .reset-btn:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }

    /* Collapsed step */
    .step.collapsed .step-label {
      display: inline;
      margin-bottom: 0;
      margin-right: 0.5rem;
    }

    .step.collapsed .chips {
      display: inline;
    }

    .step.collapsed .chip:not(.selected) {
      display: none;
    }

    .step.collapsed .chip.selected {
      cursor: pointer;
    }

    /* Hidden */
    .hidden { display: none !important; }

    /* Footer */
    footer {
      margin-top: auto;
      padding-top: 3rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.7rem;
    }

    footer .prompt-symbol {
      color: var(--green);
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 0.75rem;
    }

    .social-links a {
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .social-links a:hover {
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><img src="logo.png" alt="blame.sh" class="header-logo">blame<span>.sh</span></h1>
      <p id="subtitle">Gerador de desculpas para devs</p>
      <div class="lang-toggle">
        <button class="lang-btn active" data-lang="pt">PT</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </header>
  </div>

  <div class="terminal-prompt">
    <div class="prompt-line">
      <span class="prompt-symbol">$ </span>
      <span class="cmd">blame</span>
      <span id="prompt-args"></span>
      <span class="cursor"></span>
    </div>
    <button class="generate-btn hidden" id="generate-btn">$ ./blame.sh</button>
  </div>

  <div class="container">
    <div class="step" id="step-persona">
      <div class="step-label"><span>#1</span> <span id="label-persona">Quem vai ouvir?</span></div>
      <div class="chips" id="persona-chips"></div>
    </div>

    <div class="step hidden" id="step-situation">
      <div class="step-label"><span>#2</span> <span id="label-situation">O que aconteceu?</span></div>
      <div class="chips" id="situation-chips"></div>
    </div>

    <div class="results hidden" id="results"></div>

    <div class="reset-wrap hidden" id="reset-wrap">
      <button class="reset-btn" id="reset-btn">reset</button>
    </div>
  </div>

  <footer>
    <p><span class="prompt-symbol">$ </span>echo "built with caffeine and plausible deniability"</p>
    <div class="social-links">
      <a href="https://linkedin.com/in/felipebossolani" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <a href="https://x.com/felipebossolani" target="_blank" rel="noopener noreferrer" aria-label="X">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>
      </a>
      <a href="https://github.com/felipebossolani" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>
      </a>
    </div>
  </footer>

  <script>
    const i18n = {
      pt: {
        subtitle: 'Gerador de desculpas para devs',
        labelPersona: 'Quem vai ouvir?',
        labelSituation: 'O que aconteceu?',
        generate: '$ ./blame.sh',
        reset: 'reset',
        copy: 'copiar',
        copied: 'copiado!',
        share: 'compartilhar',
        shared: 'copiado!',
        tones: { tecnica: 'Técnica', vaga: 'Vaga', dramatica: 'Dramática' }
      },
      en: {
        subtitle: 'Developer excuse generator',
        labelPersona: 'Who\'s listening?',
        labelSituation: 'What happened?',
        generate: '$ ./blame.sh',
        reset: 'reset',
        copy: 'copy',
        copied: 'copied!',
        share: 'share',
        shared: 'copied!',
        tones: { tecnica: 'Technical', vaga: 'Vague', dramatica: 'Dramatic' }
      }
    };

    let data = null;
    let state = { lang: 'pt', persona: null, situation: null };

    async function init() {
      const res = await fetch('excuses.json');
      data = await res.json();
      renderPersonas();
      bindEvents();
    }

    function bindEvents() {
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.lang = btn.dataset.lang;
          state.persona = null;
          state.situation = null;
          document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          document.documentElement.lang = state.lang === 'pt' ? 'pt-BR' : 'en';
          updateLabels();
          renderPersonas();
          document.getElementById('step-persona').classList.remove('collapsed');
          hideElement('step-situation');
          hideElement('generate-btn');
          hideElement('results');
          hideElement('reset-wrap');
          updatePrompt();
        });
      });

      document.getElementById('generate-btn').addEventListener('click', generate);
      document.getElementById('reset-btn').addEventListener('click', reset);
    }

    function updateLabels() {
      const t = i18n[state.lang];
      document.getElementById('subtitle').textContent = t.subtitle;
      document.getElementById('label-persona').textContent = t.labelPersona;
      document.getElementById('label-situation').textContent = t.labelSituation;
      document.getElementById('generate-btn').textContent = t.generate;
      document.getElementById('reset-btn').textContent = t.reset;
    }

    function renderPersonas() {
      const container = document.getElementById('persona-chips');
      const personas = Object.keys(data.excuses[state.lang]);
      container.innerHTML = '';
      personas.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.textContent = p;
        btn.addEventListener('click', () => selectPersona(p));
        container.appendChild(btn);
      });
    }

    function selectPersona(persona) {
      if (state.persona === persona) {
        document.getElementById('step-persona').classList.remove('collapsed');
        return;
      }
      state.persona = persona;
      state.situation = null;
      document.querySelectorAll('#persona-chips .chip').forEach(c => {
        c.classList.toggle('selected', c.textContent === persona);
      });
      document.getElementById('step-persona').classList.add('collapsed');
      document.getElementById('step-situation').classList.remove('collapsed');
      renderSituations();
      showElement('step-situation');
      hideElement('generate-btn');
      hideElement('results');
      hideElement('reset-wrap');
      updatePrompt();
    }

    function renderSituations() {
      const container = document.getElementById('situation-chips');
      const situations = Object.keys(data.excuses[state.lang][state.persona]);
      container.innerHTML = '';
      situations.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.textContent = s;
        btn.addEventListener('click', () => selectSituation(s));
        container.appendChild(btn);
      });
    }

    function selectSituation(situation) {
      if (state.situation === situation) {
        document.getElementById('step-situation').classList.remove('collapsed');
        return;
      }
      state.situation = situation;
      document.querySelectorAll('#situation-chips .chip').forEach(c => {
        c.classList.toggle('selected', c.textContent === situation);
      });
      document.getElementById('step-situation').classList.add('collapsed');
      showElement('generate-btn');
      hideElement('results');
      hideElement('reset-wrap');
      updatePrompt();
    }

    function updatePrompt() {
      const args = document.getElementById('prompt-args');
      let text = '';
      if (state.persona) {
        text += ` <span class="flag">--who=</span><span class="value">"${state.persona}"</span>`;
      }
      if (state.situation) {
        text += ` <span class="flag">--incident=</span><span class="value">"${state.situation}"</span>`;
      }
      args.innerHTML = text;
    }

    function generate() {
      const excuses = data.excuses[state.lang][state.persona][state.situation];
      const container = document.getElementById('results');
      const t = i18n[state.lang];
      container.innerHTML = '';

      ['tecnica', 'vaga', 'dramatica'].forEach(tone => {
        const card = document.createElement('div');
        card.className = `result-card ${tone}`;
        card.innerHTML = `
          <div class="tone-label">${t.tones[tone]}</div>
          <div class="excuse-text"></div>
          <div class="card-actions">
            <button class="card-btn share-btn">${t.share}</button>
            <button class="card-btn copy-btn">${t.copy}</button>
          </div>
        `;
        container.appendChild(card);

        const textEl = card.querySelector('.excuse-text');
        typewriter(textEl, excuses[tone]);

        card.querySelector('.copy-btn').addEventListener('click', function() {
          navigator.clipboard.writeText(excuses[tone]);
          this.textContent = t.copied;
          this.classList.add('copied');
          setTimeout(() => {
            this.textContent = t.copy;
            this.classList.remove('copied');
          }, 1500);
        });

        card.querySelector('.share-btn').addEventListener('click', function() {
          const shareText = `I used blame.sh to explain why ${state.situation} to ${state.persona}. It worked. blame.sh`;
          navigator.clipboard.writeText(shareText);
          this.textContent = t.shared;
          this.classList.add('copied');
          setTimeout(() => {
            this.textContent = t.share;
            this.classList.remove('copied');
          }, 1500);
        });
      });

      showElement('results');
      showElement('reset-wrap');
    }

    function typewriter(el, text) {
      el.textContent = '';
      let i = 0;
      const interval = setInterval(() => {
        el.textContent += text[i];
        i++;
        if (i >= text.length) clearInterval(interval);
      }, 30);
    }

    function reset() {
      state.persona = null;
      state.situation = null;
      document.querySelectorAll('#persona-chips .chip').forEach(c => c.classList.remove('selected'));
      document.getElementById('step-persona').classList.remove('collapsed');
      document.getElementById('step-situation').classList.remove('collapsed');
      hideElement('step-situation');
      hideElement('generate-btn');
      hideElement('results');
      hideElement('reset-wrap');
      updatePrompt();
    }

    function showElement(id) { document.getElementById(id).classList.remove('hidden'); }
    function hideElement(id) { document.getElementById(id).classList.add('hidden'); }

    init();
  </script>
</body>
</html>
